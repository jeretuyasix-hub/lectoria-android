name: Construir APK de Lectoria

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar firma Android de desarrollo
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lectoria-android-debug-keystore-v1

      - name: Crear firma Android de desarrollo si falta
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Lectoria Desarrollo, O=Lectoria, C=EC"
          fi

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar aplicación web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Crear icono adaptativo de libro abierto
        run: |
          python - <<'PY'
          from pathlib import Path
          res=Path('android/app/src/main/res')
          (res/'drawable').mkdir(parents=True,exist_ok=True)
          (res/'values').mkdir(parents=True,exist_ok=True)
          (res/'mipmap-anydpi-v26').mkdir(parents=True,exist_ok=True)
          # Vector: resolución independiente. Todo el libro queda dentro de la zona segura central
          # para que Android pueda recortarlo como círculo, squircle o cualquier máscara sin cortarlo.
          (res/'drawable'/'lectoria_book_foreground.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0E5C4B" android:pathData="M31,39 C38,35 45,35 51,39 L51,71 C45,67 38,67 31,70 Z"/>
            <path android:fillColor="#16715B" android:pathData="M57,39 C63,35 70,35 77,39 L77,70 C70,67 63,67 57,71 Z"/>
            <path android:fillColor="#E1BA59" android:pathData="M52.5,38 L55.5,38 L55.5,72 L52.5,72 Z"/>
            <path android:fillColor="#FFFFFF" android:fillAlpha="0.36" android:pathData="M35,44 C40,42 45,43 48,45 L48,48 C44,46 40,46 35,48 Z"/>
            <path android:fillColor="#FFFFFF" android:fillAlpha="0.36" android:pathData="M60,45 C64,43 69,42 73,44 L73,48 C69,46 64,46 60,48 Z"/>
            <path android:fillColor="#0A493C" android:fillAlpha="0.35" android:pathData="M31,70 C39,67 46,68 52,73 C45,70 38,70 31,73 Z"/>
            <path android:fillColor="#0A493C" android:fillAlpha="0.35" android:pathData="M56,73 C62,68 69,67 77,70 L77,73 C70,70 63,70 56,73 Z"/>
          </vector>''')
          (res/'values'/'lectoria_launcher_colors.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><resources><color name="lectoria_icon_background">#F4EFE3</color></resources>''')
          adaptive='''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/lectoria_icon_background"/>
            <foreground android:drawable="@drawable/lectoria_book_foreground"/>
          </adaptive-icon>'''
          (res/'mipmap-anydpi-v26'/'ic_launcher.xml').write_text(adaptive)
          (res/'mipmap-anydpi-v26'/'ic_launcher_round.xml').write_text(adaptive)
          PY

      - name: Activar permisos Android necesarios
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permissions=[
            '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]
          for perm in permissions:
              if perm not in s:
                  s=s.replace('<application', perm+'\n    <application', 1)
          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lectoria.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Lectoria-APK
          path: Lectoria.apk
          if-no-files-found: error
