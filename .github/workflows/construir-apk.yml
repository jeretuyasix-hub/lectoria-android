name: Construir APK de Lectoria

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar aplicación web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Activar permiso de alarma exacta
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perm='<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if perm not in s:
              s=s.replace('<application', perm+'\n    <application', 1)
          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lectoria.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Lectoria-APK
          path: Lectoria.apk
          if-no-files-found: error
